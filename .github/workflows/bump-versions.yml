name: Bump package versions on new releases

on:
  schedule:
    - cron: '0 * * * *'   # hourly
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Bump pkgver to latest release tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # package -> source repo
          declare -A repos=(
            [orbit-status]=steven66619/orbit-status
            [orbiter]=steven66619/orbiter
            [realspeed-cli]=steven66619/realspeed-cli
          )
          changed=0
          for pkg in "${!repos[@]}"; do
            repo="${repos[$pkg]}"
            pkgbuild="packages/$pkg/PKGBUILD"
            [ -f "$pkgbuild" ] || continue
            # Latest release = tag with the highest version number, in the
            # format v<version>-<codename> (e.g. v1.8-nebula). Legacy plain
            # numeric tags (v1.7) sort lower than their codename twin.
            latest_tag=$(curl -fsSL "https://api.github.com/repos/$repo/tags?per_page=100" \
              | jq -r '.[].name' \
              | grep -E '^v[0-9]' \
              | sort -V \
              | tail -1)
            [ -n "$latest_tag" ] || { echo "No version tags for $repo, skipping"; continue; }
            version=$(printf '%s' "$latest_tag" | sed 's/^v//; s/-.*//')
            codename=$(printf '%s' "$latest_tag" | sed -n 's/^v[0-9.]*-//p')
            if [ -z "$codename" ]; then
              echo "Latest tag $latest_tag has no codename; skipping $pkg"
              continue
            fi
            current_version=$(sed -n 's/^pkgver=//p' "$pkgbuild")
            current_codename=$(sed -n 's/^_codename=//p' "$pkgbuild")
            if [ "$version" != "$current_version" ] || [ "$codename" != "$current_codename" ]; then
              sed -i "s/^pkgver=.*/pkgver=$version/" "$pkgbuild"
              sed -i "s/^_codename=.*/_codename=$codename/" "$pkgbuild"
              echo "Bumped $pkg: $current_version-$current_codename -> $version-$codename"
              changed=1
            else
              echo "$pkg already at $version-$codename"
            fi
          done
          if [ "$changed" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add packages/
            git commit -m "chore: bump package versions to latest releases"
            git push
            # Pushes made with GITHUB_TOKEN do not trigger other workflows,
            # so explicitly kick off the publish workflow.
            gh workflow run "Deploy package repo to GitHub Pages" --ref main
          else
            echo "No version bumps needed"
          fi