name: Deploy package repo to GitHub Pages

on:
  push:
    branches: [main, personal]
    paths:
      - 'repo/**'
      - 'PKGBUILD'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-void:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Void .xbps package
        run: |
          chmod +x mkpkg
          ./mkpkg void 2>&1 || echo "Void build skipped (non-fatal)"

      - name: Upload Void package artifact
        uses: actions/upload-artifact@v4
        with:
          name: void-xbps
          path: repo/void/x86_64/

  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel pacman-contrib \
            wayland wayland-protocols cairo pango libxkbcommon glib2 \
            librsvg dbus libpulse lua lua54

      - name: Build package and regenerate Arch repo metadata
        run: |
          # makepkg refuses to run as root; build as a non-root user
          useradd -m builder
          chown -R builder:builder .
          su builder -c "cd $PWD && makepkg -f --noconfirm"
          # Drop the -debug package makepkg also produces
          rm -f orbit-status-debug-*.pkg.tar.zst
          mkdir -p repo/arch/x86_64
          cp orbit-status-*.pkg.tar.zst repo/arch/x86_64/
          # Regenerate metadata from scratch so old versions don't linger
          rm -f repo/arch/x86_64/orbit-status.db* repo/arch/x86_64/orbit-status.files*
          chmod +x repo/update-repo.sh
          ./repo/update-repo.sh arch
          # repo-add creates .db.tar.zst/.files.tar.zst and symlinks the plain
          # names; publish real files so GitHub Pages serves them
          rm -f repo/arch/x86_64/orbit-status.db repo/arch/x86_64/orbit-status.files
          cp -f repo/arch/x86_64/orbit-status.db.tar.zst repo/arch/x86_64/orbit-status.db
          cp -f repo/arch/x86_64/orbit-status.files.tar.zst repo/arch/x86_64/orbit-status.files

      - name: Upload Arch repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-repo
          path: repo/arch/

  deploy:
    runs-on: ubuntu-latest
    needs: [build-arch, build-void]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Void package artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: void-xbps
          path: repo/void/x86_64/

      - name: Download Arch repo artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: arch-repo
          path: repo/arch/

      - name: Install repo tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev apt-utils createrepo-c

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --import --batch 2>/dev/null
            echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 --list-secret-keys 2>/dev/null || true
          fi

      - name: Regenerate repo metadata
        run: |
          chmod +x repo/update-repo.sh
          GPG_KEY="${GPG_KEY:-steven4x4@gmail.com}" ./repo/update-repo.sh apt
          GPG_KEY="${GPG_KEY:-steven4x4@gmail.com}" ./repo/update-repo.sh yum
          GPG_KEY="${GPG_KEY:-steven4x4@gmail.com}" ./repo/update-repo.sh arch
          # Sign Void repodata manually (xbps-rindex only on Void)
          void_repodata=$(ls repo/void/x86_64/*-repodata 2>/dev/null | head -1)
          if [ -n "$void_repodata" ] && gpg --list-keys "$GPG_KEY" &>/dev/null 2>&1; then
            gpg --detach-sign -o "${void_repodata}.sig" "$void_repodata" 2>/dev/null
            echo "Void repodata signed: ${void_repodata}.sig"
          fi
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          destination_dir: ./
          keep_files: false
